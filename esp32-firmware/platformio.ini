; PlatformIO project — ESP32-S3 firmware para EV Charger
; Abra esta pasta no VS Code com a extensão PlatformIO instalada.

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
